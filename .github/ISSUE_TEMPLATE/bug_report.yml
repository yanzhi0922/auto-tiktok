name: Bug report / 缺陷反馈
description: Report a reproducible problem in Auto TikTok.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Auto TikTok.

        请不要粘贴 API Key、access token、完整 `.env`、原始 Docker config 输出或包含隐私信息的日志。
  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题概述
      description: What went wrong?
      placeholder: Autopilot fails when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: List the exact commands or dashboard actions.
      placeholder: |
        1. Run `python autopilot.py run --count 1`
        2. Open dashboard
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include redacted logs or screenshots if useful.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime / 运行方式
      options:
        - Local Python
        - Docker Compose dashboard
        - Docker Compose autopilot profile
        - Windows scheduled task
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: v0.1.0 or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: |
        OS:
        Python:
        Docker:
        ffmpeg:
        MiniMax plan tier:
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checklist / 安全检查
      options:
        - label: I removed secrets, API keys, tokens, and private URLs from this report.
          required: true
        - label: I searched existing issues and discussions first.
          required: true
