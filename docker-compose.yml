services:
  dashboard:
    build: .
    env_file:
      - .env
    environment:
      AUTO_TIKTOK_DASHBOARD_LOCAL_ONLY: "true"
      AUTO_TIKTOK_TASK_WORKERS: "1"
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./config/auto_config.yaml:/app/config/auto_config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["python", "dashboard.py", "--host", "0.0.0.0", "--port", "7860"]

  run-once:
    build: .
    profiles: ["run-once"]
    env_file:
      - .env
    environment:
      AUTO_TIKTOK_DASHBOARD_LOCAL_ONLY: "true"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./config/auto_config.yaml:/app/config/auto_config.yaml:ro
    command: ["python", "auto_scheduler.py", "--run-now", "--count", "3"]

  autopilot:
    build: .
    profiles: ["autopilot"]
    env_file:
      - .env
    environment:
      AUTO_TIKTOK_DASHBOARD_LOCAL_ONLY: "true"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./config/auto_config.yaml:/app/config/auto_config.yaml:ro
    command: ["python", "autopilot.py", "run"]
